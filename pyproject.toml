[project]
name = "onnxcc"
version = "0.1.0"
description = "Ahead-of-time compiler from ONNX to one self-contained C99 file, with int8 quantization"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "onnx>=1.17"]

[project.scripts]
onnxcc = "onnxcc.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onnxcc"]

[dependency-groups]
dev = [
    "clang-format>=18",
    "hypothesis>=2.0",
    "mypy>=1.11",
    "onnxruntime>=1.20",
    "pytest>=8",
    "pytest-xdist>=3.6",
    "ruff>=0.6",
]
train = ["onnxscript>=0.1", "torch>=2.4"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src/onnxcc"]
strict = true

[[tool.mypy.overrides]]
module = ["onnx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
